# .github/workflows/ci.yml
# CI/CD Pipeline pour le projet de recommandation de films

name: CI - Tests Automatisés

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: movie_recommendation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
    
    - name: Create data directories
      run: |
        mkdir -p data/raw data/processed
    
    - name: Download datasets
      run: |
        if [ ! -f data/raw/movies.csv ]; then
          echo "Downloading movies.csv..."
          curl -L -o data/raw/movies.csv https://files.grouplens.org/datasets/movielens/ml-latest-small/movies.csv
        fi
        if [ ! -f data/raw/ratings.csv ]; then
          echo "Downloading ratings.csv..."
          curl -L -o data/raw/ratings.csv https://files.grouplens.org/datasets/movielens/ml-latest-small/ratings.csv
        fi
        ls -la data/raw/
    
    - name: Wait for MySQL
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client
        while ! mysqladmin ping -h"127.0.0.1" -P 3306 --silent; do
          echo "Waiting for MySQL..."
          sleep 2
        done
    
    - name: Initialize database
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -prootpassword << EOF
        CREATE DATABASE IF NOT EXISTS movie_recommendation_test;
        USE movie_recommendation_test;
        CREATE TABLE IF NOT EXISTS movies (
          movieId INT PRIMARY KEY,
          title TEXT,
          genres TEXT
        );
        CREATE TABLE IF NOT EXISTS ratings (
          userId INT,
          movieId INT,
          rating FLOAT,
          timestamp INT
        );
        EOF
    
    - name: Load data into database
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -prootpassword movie_recommendation_test -e "
          LOAD DATA LOCAL INFILE 'data/raw/movies.csv' 
          INTO TABLE movies 
          FIELDS TERMINATED BY ',' 
          ENCLOSED BY '\"' 
          LINES TERMINATED BY '\n' 
          IGNORE 1 ROWS;
        "
        mysql -h 127.0.0.1 -P 3306 -u root -prootpassword movie_recommendation_test -e "
          LOAD DATA LOCAL INFILE 'data/raw/ratings.csv' 
          INTO TABLE ratings 
          FIELDS TERMINATED BY ',' 
          LINES TERMINATED BY '\n' 
          IGNORE 1 ROWS;
        "
    
    - name: Setup test environment
      run: |
        echo "MYSQL_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "MYSQL_PORT=3306" >> $GITHUB_ENV
        echo "MYSQL_ROOT_PASSWORD=rootpassword" >> $GITHUB_ENV
        echo "MYSQL_DATABASE=movie_recommendation_test" >> $GITHUB_ENV
    
    - name: Run tests
      run: |
        python -m pytest tests/ \
          -v \
          --ignore=tests/performance/
    
    - name: Test summary
      run: |
        echo "✅ Tous les tests sont passés !"